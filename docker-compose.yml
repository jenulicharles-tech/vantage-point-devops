services:

  web:
    build: .
    image: ${DOCKERHUB_USERNAME:-yourdockerhubusername}/vantage-point-website:latest
    container_name: vantage-point-web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: vantage_point_international
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: vantage-point-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: vantage_point_international
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

volumes:
  db_data: